CSS


<style>
  .slider {
    overflow: hidden;
    position: relative;
    width: 100%;
    background: #f0f0f0;
  }

  .slide-track {
    display: flex;
    width: calc(900px * 8); /* 8 slides × 900px each */
    animation: scroll 30s linear infinite;
  }

  .slide {
    width: 900px;
    height: 500px;
    flex-shrink: 0;
    margin: 0 10px;
  }

  .slide img {
    width: 900px;
    height: 500px;
    object-fit: cover; /* keeps aspect ratio nicely */
    border-radius: 8px;
  }

  .slide-track {
  display: flex;
  width: calc(900px * 8); /* 8 slides × 900px each */
  animation: scroll 60s linear infinite; /* slower movement */
}

  @keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
